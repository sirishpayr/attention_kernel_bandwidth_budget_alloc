[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sirishpayr-toolproto_jd012"
version = "0.1.0"
description = "按给定权重把总额度分配到各项，报告超分配项与利用率"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "sirishpayr" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://sirishpayr.github.io"
Repository = "https://github.com/sirishpayr/toolproto_jd012"
Issues = "https://github.com/sirishpayr/toolproto_jd012/issues"

[project.scripts]
toolproto_jd012 = "toolproto_jd012:main"

[tool.setuptools]
py-modules = ["toolproto_jd012"]
